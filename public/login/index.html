<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in to Shop Crank</title>
    <link rel="canonical" href="https://www.shopcrank.com/login/" />
    <link rel="icon" href="/shopcrank-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/fonts/fonts.css" />
    <link rel="stylesheet" href="/market.css" />
  </head>
  <body class="auth-screen">
    <main class="auth-card">
      <a class="brand" href="/features"><span class="brand-mark">M</span><span><strong>SHOP_CRANK</strong><small>Shop operating system</small></span></a>
      <h1>Sign in with your work email</h1>
      <p>We will open a one-time link for this browser. Shop Crank never receives your password.</p>
      <form id="login-form">
        <label for="email">Work email<input id="email" type="email" name="email" placeholder="you@yourshop.com" autocomplete="username" required /></label>
        <button class="btn primary" type="submit">Continue securely</button>
      </form>
      <p id="error" class="error" hidden></p>
      <div class="auth-links">
        <a href="/signup">Create a shop</a>
        <a href="/downloads">Install the apps</a>
      </div>
    </main>
    <script>
      const form = document.querySelector('#login-form');
      const errorEl = document.querySelector('#error');
      const plan = new URLSearchParams(window.location.search).get('plan');
      const returnTo = ['starter', 'shop', 'pro'].includes(plan)
        ? `/app?plan=${encodeURIComponent(plan)}`
        : '/';
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorEl.hidden = true;
        const button = form.querySelector('button');
        const email = String(new FormData(form).get('email') || '').trim().toLowerCase();
        button.disabled = true;
        try {
          const response = await fetch('/api/auth/magic-link', {
            method: 'POST',
            credentials: 'include',
            headers: { Accept: 'application/json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, returnTo }),
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(payload.message || 'Could not start sign-in');
          const loginUrl = payload.loginUrl || payload.login_url || payload.url;
          if (loginUrl) {
            location.assign(loginUrl);
            return;
          }
          errorEl.hidden = false;
          errorEl.className = 'success';
          errorEl.textContent = payload.message || 'Check your email for a sign-in link.';
          button.disabled = false;
          button.textContent = 'Send another link';
          return;
        } catch (error) {
          const raw = String(error?.message || '');
          errorEl.hidden = false;
          errorEl.className = 'error';
          errorEl.textContent = /failed to fetch|networkerror|load failed/i.test(raw)
            ? 'Could not reach Shop Crank sign-in. Use the latest Windows installer from Downloads, or open the site in a browser.'
            : (raw || 'Sign-in failed.');
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
