name: Deploy Pages (manual)

# Production publish of Worker + Pages is .github/workflows/cloudflare-pages.yml.
# This workflow is a Pages-only fallback that deploys the staged UI shell to
# shopcrank-dispatch. Do not deploy the repository root — that would publish
# Worker source and tests.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild
      - run: npm run build:web && npm run stage:pages

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .pages-dist --project-name=shopcrank-dispatch --commit-dirty=true
