name: Windows desktop release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-desktop.yml'
      - 'diagnostics/j2534-service/**'
      - 'desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.js'
      - 'diagnostics-ui.js'
      - 'src/**'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-desktop.yml'
      - 'diagnostics/j2534-service/**'
      - 'desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.js'
      - 'diagnostics-ui.js'
      - 'src/**'
      - 'scripts/**'

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-j2534:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - name: Test J2534 host authorization
        run: dotnet test diagnostics/j2534-service/tests/J2534.Host.Tests/J2534.Host.Tests.csproj -c Release
      - name: Publish J2534.Host.exe
        shell: pwsh
        run: ./diagnostics/j2534-service/scripts/publish-win-x64.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: j2534-host-win-x64
          path: diagnostics/j2534-service/publish/win-x64/J2534.Host.exe

  build-installer:
    needs: build-j2534
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: j2534-host-win-x64
          path: diagnostics/j2534-service/publish/win-x64
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild electron
      - name: Build web bundle
        run: npm run build:web
      - name: Check code-signing certificate
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::warning title=Windows installer is unsigned::SmartScreen will warn customers. Buy an OV/EV code-signing certificate and add WINDOWS_CSC_LINK (base64 .pfx or https URL) and WINDOWS_CSC_KEY_PASSWORD as repository secrets."
          fi
      - name: Build NSIS installer and portable zip
        env:
          # electron-builder signs automatically when these are set and skips signing when empty.
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis zip --publish never
      - name: Verify Authenticode signature
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
        run: |
          $exe = Get-ChildItem dist/windows/*.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "Signature status: $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($env:CSC_LINK -and $sig.Status -ne 'Valid') { throw "Installer signing failed: $($sig.Status)" }
      - name: Smoke test Windows artifacts
        shell: bash
        run: |
          set -euo pipefail
          EXE="$(ls dist/windows/*.exe | head -n1)"
          ZIP="$(ls dist/windows/*.zip | head -n1)"
          test -s "$EXE"
          test -s "$ZIP"
      - name: Build offline PC installer
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:windows:offline
      - name: Smoke test offline installer
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          test -s "dist/windows-offline/ShopCrank-Offline-Setup-${VERSION}.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shopcrank-windows-installer
          path: |
            dist/windows/*.exe
            dist/windows/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shopcrank-offline-installer
          path: dist/windows-offline/ShopCrank-Offline-Setup-*.exe
          if-no-files-found: error

  build-demo:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild electron
      - run: npm run test:desktop && npm run test:offline
      - name: Build offline flash-drive demo (no credentials or native host)
        run: npm run build:windows:demo
      - name: Smoke test extracted demo from a folder with spaces
        shell: pwsh
        run: |
          $zip = Get-Item dist/windows-demo/ShopCrank-Demo-USB-*.zip
          $demo = Join-Path $env:RUNNER_TEMP "USB Demo"
          Expand-Archive -Path $zip.FullName -DestinationPath $demo
          if (!(Test-Path (Join-Path $demo "START-HERE.txt"))) { throw "Demo instructions missing" }
          if (Test-Path (Join-Path $demo "resources/diagnostics-secrets")) { throw "Demo must not bundle credentials" }
          function Invoke-DemoSmokeTest($exe, $name) {
            $stdout = Join-Path $env:RUNNER_TEMP "$name.stdout.log"
            $stderr = Join-Path $env:RUNNER_TEMP "$name.stderr.log"
            $process = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
            if (!$process.WaitForExit(60000)) { $process.Kill(); throw "$name smoke test timed out" }
            if ($process.ExitCode -ne 0) {
              Write-Host "$name smoke test failed: $($process.ExitCode)"
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw "$name smoke test failed: $($process.ExitCode)"
            }
          }
          $exe = Join-Path $demo "ShopCrank Demo.exe"
          Invoke-DemoSmokeTest $exe "USB Demo"
          if (!(Test-Path (Join-Path $demo "ShopCrank Demo Data"))) { throw "Drive-local profile missing" }
          # Run again after relocating the entire folder, as when the drive letter changes.
          $moved = Join-Path $env:RUNNER_TEMP "Moved USB Demo"
          Move-Item $demo $moved
          Invoke-DemoSmokeTest (Join-Path $moved "ShopCrank Demo.exe") "Relocated USB Demo"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shopcrank-usb-demo
          path: dist/windows-demo/ShopCrank-Demo-USB-*.zip
          if-no-files-found: error

  publish-github-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-installer, build-demo]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shopcrank-windows-installer
          path: dist/windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shopcrank-usb-demo
          path: dist/windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shopcrank-offline-installer
          path: dist/windows
      - name: Upload installer to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="desktop-v${VERSION}"
          REPO="${{ github.repository }}"
          NOTES="Automated Windows build from ${GITHUB_SHA}. Includes the production installer/ZIP, the offline PC installer ShopCrank-Offline-Setup-${VERSION}.exe, plus ShopCrank-Demo-USB-${VERSION}.zip: extract the entire demo ZIP to a writable flash drive and run ShopCrank Demo.exe offline."
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/windows/*.exe dist/windows/*.zip --clobber --repo "$REPO"
          else
            gh release create "$TAG" dist/windows/*.exe dist/windows/*.zip \
              --repo "$REPO" \
              --title "ShopCrank Desktop ${VERSION}" \
              --notes "$NOTES"
          fi

  publish-download:
    # Job-level `if` cannot read secrets; skip the R2 upload in a step instead.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-installer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shopcrank-windows-installer
          path: dist/windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shopcrank-offline-installer
          path: dist/windows
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.YOUR_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=R2 installer publish skipped::Add repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to publish the Windows installer to R2."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish Windows installer to R2
        if: steps.creds.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.YOUR_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET || 'shopcrank-files' }}
        run: |
          set -u
          VERSION="$(node -p "require('./package.json').version")"
          if ! npx wrangler r2 object put "$R2_BUCKET/downloads/ShopCrank-Setup-${VERSION}.exe" --remote --file "dist/windows/ShopCrank-Setup-${VERSION}.exe" --content-type application/octet-stream --cache-control "public, max-age=300"; then
            echo "::warning title=R2 installer publish failed::Token lacks R2 write permission. GitHub Release assets are still published; upload the EXE/ZIP to R2 manually or grant Workers R2 write on CLOUDFLARE_API_TOKEN."
            exit 0
          fi
          npx wrangler r2 object put "$R2_BUCKET/downloads/ShopCrank-Setup-${VERSION}.zip" --remote --file "dist/windows/ShopCrank-Setup-${VERSION}.zip" --content-type application/zip --cache-control "public, max-age=300"
          npx wrangler r2 object put "$R2_BUCKET/downloads/ShopCrank-Offline-Setup-${VERSION}.exe" --remote --file "dist/windows/ShopCrank-Offline-Setup-${VERSION}.exe" --content-type application/octet-stream --cache-control "public, max-age=300"
