name: Build and deploy to Cloudflare R2
on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

concurrency:
  group: deploy-r2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Restore & build
        run: |
          dotnet restore diagnostics/j2534-service/J2534Service.sln
          dotnet build diagnostics/j2534-service/J2534Service.sln -c Release --no-restore

      - name: Publish
        run: dotnet publish diagnostics/j2534-service/src/J2534.Host/J2534.Host.csproj -c Release --no-build -o ./artifacts/publish

      - name: Create zip
        run: |
          cd artifacts
          if ! command -v zip >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y zip
          fi
          zip -r publish.zip publish

      - name: Upload zip to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -eux
          R2_ENV_FILE="$RUNNER_TEMP/r2-upload-env"
          node scripts/resolve-r2-upload-env.mjs "$R2_ENV_FILE"
          set +x
          . "$R2_ENV_FILE"
          set -x
          if [ "${SKIP_UPLOAD}" = "1" ]; then
            echo "::notice title=R2 upload skipped::${SKIP_REASON}"
            exit 0
          fi
          echo "Resolved R2 upload target configuration."
          KEY="j2534-service/publish-${{ github.run_id }}.zip"
          npx wrangler r2 object put "${BUCKET}/${KEY}" --file artifacts/publish.zip --remote
          echo "Uploaded r2://${BUCKET}/${KEY}"
