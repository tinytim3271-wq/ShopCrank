name: Cloudflare deploy

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'theme.css'
      - 'service-worker.js'
      - 'diagnostics-ui.js'
      - 'manifest.webmanifest'
      - 'assets/**'
      - 'public/**'
      - 'worker/**'
      - 'wrangler.jsonc'
      - '.github/workflows/cloudflare-pages.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'theme.css'
      - 'service-worker.js'
      - 'diagnostics-ui.js'
      - 'manifest.webmanifest'
      - 'assets/**'
      - 'public/**'
      - 'worker/**'
      - 'wrangler.jsonc'
      - '.github/workflows/cloudflare-pages.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npm run test:config
      - run: npm run test:worker
      - run: npm run stage:pages
      - name: Smoke check staged UI shell
        run: |
          set -euo pipefail
          test -f .pages-dist/index.html
          grep -q '<div id="root"></div>' .pages-dist/index.html
          grep -q 'app.js' .pages-dist/index.html
      - run: npx --no-install wrangler deploy --dry-run

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.CLOUDFLARE_DEPLOY_ENABLED != 'false'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.YOUR_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cloudflare publish skipped::Add repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, or set CLOUDFLARE_DEPLOY_ENABLED=false to silence this notice."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify Cloudflare credentials
        id: verify-creds
        if: steps.creds.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.YOUR_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! ./node_modules/.bin/wrangler whoami; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cloudflare publish skipped::The configured CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is invalid. Rotate the repository secrets to re-enable automatic deployment."
          else
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure D1 binding and CORS origins
        if: steps.verify-creds.outputs.valid == 'true'
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_ALLOWED_ORIGINS: ${{ vars.CLOUDFLARE_ALLOWED_ORIGINS }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'wrangler.jsonc';
          // Strip JSONC comments for parsing, then write pretty JSON (wrangler accepts JSON).
          const raw = fs.readFileSync(path, 'utf8');
          const jsonText = raw
            .replace(/\/\*[\s\S]*?\*\//g, '')
            .replace(/^\s*\/\/.*$/gm, '')
            .replace(/,\s*([}\]])/g, '$1');
          const config = JSON.parse(jsonText);
          const placeholder = '00000000-0000-0000-0000-000000000000';
          const databaseId = process.env.CLOUDFLARE_D1_DATABASE_ID;
          const d1 = (config.d1_databases || [])[0];
          if (!d1) {
            console.error('wrangler.jsonc is missing d1_databases[0]');
            process.exit(1);
          }
          if (databaseId) {
            d1.database_id = databaseId;
          }
          if (!d1.database_id || d1.database_id === placeholder) {
            console.error('Set CLOUDFLARE_D1_DATABASE_ID or put a real D1 id in wrangler.jsonc');
            process.exit(1);
          }
          if (process.env.CLOUDFLARE_ALLOWED_ORIGINS) {
            // Replace the full ALLOWED_ORIGINS value (comma-separated list), not a substring.
            config.vars = config.vars || {};
            config.vars.ALLOWED_ORIGINS = process.env.CLOUDFLARE_ALLOWED_ORIGINS;
          }
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          console.log(`D1 database_id=${d1.database_id}`);
          console.log(`ALLOWED_ORIGINS=${config.vars?.ALLOWED_ORIGINS || '(unchanged)'}`);
          NODE
      - name: Apply D1 migrations
        if: steps.verify-creds.outputs.valid == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.YOUR_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote
      - name: Provision Google sign-in secrets
        id: google-secrets
        if: steps.verify-creds.outputs.valid == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.YOUR_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          # Missing credentials must not block the Worker deploy: Google sign-in
          # answers 503 until they exist. "Require Google sign-in secrets" turns
          # the run red after deploy instead.
          if [ -z "${GOOGLE_CLIENT_ID:-}" ] || [ -z "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::warning title=Google sign-in not provisioned::GOOGLE_CLIENT_ID or GOOGLE_CLIENT_SECRET is missing; deploying without changing the Worker's Google credentials."
            exit 0
          fi
          printf '%s' "$GOOGLE_CLIENT_ID" | ./node_modules/.bin/wrangler secret put GOOGLE_CLIENT_ID
          printf '%s' "$GOOGLE_CLIENT_SECRET" | ./node_modules/.bin/wrangler secret put GOOGLE_CLIENT_SECRET
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "Provisioned Google OAuth credentials on the Worker."
      - name: Deploy API Worker
        if: steps.verify-creds.outputs.valid == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.YOUR_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Provision diagnostics signing key secret
        if: steps.verify-creds.outputs.valid == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.YOUR_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SIGNING_KEY: ${{ secrets.DIAGNOSTICS_SIGNING_PRIVATE_KEY }}
        run: |
          # Self-healing: push the ECDSA signing key to the Worker from the GitHub
          # secret on every deploy, so the diagnostics programming endpoints work
          # hands-off. No-op when the GitHub secret is not set.
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "No DIAGNOSTICS_SIGNING_PRIVATE_KEY GitHub secret set; skipping provisioning."
            exit 0
          fi
          printf '%s' "$SIGNING_KEY" | npx --no-install wrangler secret put DIAGNOSTICS_SIGNING_PRIVATE_KEY
          echo "Provisioned DIAGNOSTICS_SIGNING_PRIVATE_KEY on the Worker from the GitHub secret."
      - name: Build and stage Pages
        if: steps.verify-creds.outputs.valid == 'true'
        run: npm run build:web && npm run stage:pages
      - name: Ensure Pages project exists
        if: steps.verify-creds.outputs.valid == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.YOUR_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ./node_modules/.bin/wrangler pages project create "${{ vars.CLOUDFLARE_PAGES_PROJECT || 'shopcrank-dispatch' }}" --production-branch=main 2>/dev/null || true
      - name: Deploy Pages
        if: steps.verify-creds.outputs.valid == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.YOUR_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .pages-dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'shopcrank-dispatch' }} --commit-dirty=true
      - name: Verify diagnostics signing key secret
        if: steps.verify-creds.outputs.valid == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.YOUR_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Runs AFTER Worker + Pages deploy so a missing signing key never blocks
          # shipping the app; it only turns the run red to flag the misconfig.
          # Self-activating: only enforced when worker/src actually uses the key.
          if ! grep -rq "DIAGNOSTICS_SIGNING_PRIVATE_KEY" worker/src; then
            echo "worker/src does not reference DIAGNOSTICS_SIGNING_PRIVATE_KEY; skipping signing-key check."
            exit 0
          fi
          secrets_json="$(npx --no-install wrangler secret list 2>/dev/null || echo '[]')"
          if echo "$secrets_json" | grep -q '"DIAGNOSTICS_SIGNING_PRIVATE_KEY"'; then
            echo "OK: DIAGNOSTICS_SIGNING_PRIVATE_KEY is configured on the Worker."
          else
            echo "::error title=Missing Worker secret::worker/src uses DIAGNOSTICS_SIGNING_PRIVATE_KEY but it is not set on the Worker, so POST /api/diagnostics/authorize returns 503. Add the GitHub repo secret DIAGNOSTICS_SIGNING_PRIVATE_KEY (auto-provisioned on deploy), or run scripts/setup-diagnostics-signing-key.sh."
            exit 1
          fi
      - name: Post-deploy smoke checks
        if: steps.verify-creds.outputs.valid == 'true'
        env:
          APP_ORIGIN: ${{ vars.CLOUDFLARE_APP_ORIGIN || 'https://www.shopcrank.com' }}
          # Pages custom domain and the Worker /api/* route share www.shopcrank.com.
          API_ORIGIN: ${{ vars.CLOUDFLARE_API_ORIGIN || 'https://www.shopcrank.com' }}
        run: |
          set -euo pipefail
          # Cloudflare bot protection can answer GitHub-runner IPs with 403, and
          # a freshly deployed alias can 403 during propagation. Retry with a
          # browser-ish user agent, but never fail an otherwise-successful
          # publish: warn so operators can verify manually instead of red CI.
          UA='Mozilla/5.0 (compatible; ShopCrank-deploy-smoke; +https://www.shopcrank.com)'
          check() {
            local name="$1" url="$2" pattern="$3"
            if curl -fsS --retry 3 --retry-all-errors -m 30 -A "$UA" "$url" | grep -Eiq "$pattern"; then
              echo "OK: $name at $url"
            else
              echo "::warning title=Smoke check inconclusive ($name)::$url returned non-2xx or did not match '$pattern'. Deploy completed; likely Cloudflare bot protection or propagation delay. Verify $url manually."
            fi
          }
          check "API healthz" "$API_ORIGIN/api/healthz" '"ok":true'
          check "Pages shell" "$APP_ORIGIN/" 'Shop Crank|Dispatch'
      - name: Require Google sign-in secrets
        if: steps.verify-creds.outputs.valid == 'true' && steps.google-secrets.outputs.present != 'true'
        run: |
          echo "::error title=Missing Google OAuth credentials::The app deployed, but the Worker did not receive Google credentials. Add GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET as production repository secrets and re-run this workflow."
          exit 1
